# Starts a 30-day ECK trial so ELSER (semantic search) and RRF (hybrid) work.
# Without it you're on Basic: use lexical mode (setup_index --no-semantic).
apiVersion: v1
kind: Secret
metadata:
  name: eck-trial-license
  namespace: elastic-system
  labels: {license.k8s.elastic.co/type: enterprise_trial}
  annotations: {elastic.co/eula: accepted}
